# One lele.toml per workspace, discovered by walking up from the linted crate.
# Every path in this file (`file`, `folders`) is relative to this lele.toml.

[lele.config]
exclude = ["target", ".devenv", ".git"]

[lele.lint]

[honesty]
declared_honest = []
declared_dishonest = ["std::time::SystemTime::now", "std::time::Instant::now", "std::env::var", "std::fs::read", "std::fs::write", "std::fs::remove_file", "std::process::Command::new"]


[[lele.lint.inline_trait_methods]]
trait   = "bevy::app::Plugin"
methods = ["build", "ready", "finish", "cleanup"]
reason  = "plugin lifecycle methods are the plugin's wiring; read them next to the plugin struct"
