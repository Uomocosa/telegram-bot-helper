[workspace]
resolver = "2"
members = [
  "crates/telegram-bot-helper-macros",
  "crates/telegram-bot-helper",
  "crates/lele-bevy-preview",
]

[workspace.package]
version = "0.0.1"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
telegram-bot-helper = { path = "crates/telegram-bot-helper" }
telegram-bot-helper-macros = { path = "crates/telegram-bot-helper-macros" }

atomic-delegate-macros = { git = "https://github.com/Uomocosa/lele-rust-linter", tag = "v0.0.1" }
bevy = { version = "=0.19.1", default-features = false, features = ["2d", "ui"] }
blake3 = "1.8"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
derive_more = { version = "2.1", features = ["deref", "deref_mut"] }
dotenvy = "=0.15.7"
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
syn = { version = "=2.0.119", features = ["full"] }
tempfile = "=3.27.0"
thiserror = "2"
tracing = "0.1"

# Early-phase profile: optimise for compile time and peak RAM, not runtime speed.
# Debug info is a big RAM/disk cost; keep only line tables for our crates
# (readable backtraces) and none for dependencies.
[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
