[package]
name = "telegram-bot-helper"
version.workspace = true
edition = "2024"
description = "Blocking Telegram Bot API senders for debug tooling (text/photo/video)"
license.workspace = true

[dependencies]
atomic-delegate-macros.workspace = true
chrono.workspace = true
dotenvy.workspace = true
reqwest.workspace = true
serde_json.workspace = true
telegram-bot-helper-macros.workspace = true
thiserror.workspace = true

[lints.rust]
non_snake_case = "allow"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
missing_errors_doc = "allow"
